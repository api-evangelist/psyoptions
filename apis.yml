name: PsyOptions
description: >-
  PsyOptions is a decentralized options protocol built on Solana by Mithraic
  Labs, providing on-chain American-style options contracts originally designed
  for use with the Serum/OpenBook DEX. Rather than a hosted REST API, it exposes
  its functionality through open-source on-chain Anchor/BPF programs and
  first-party TypeScript client libraries (the @mithraic-labs npm scope:
  psy-american, psyoptions, market-meta, psy-token-registry, psy-metrics) plus a
  Rust crate. The project has since been sunset: its documentation and marketing
  sites are shut down, though the GitHub repositories and published packages
  remain available for reference. It was surfaced as a portfolio company of
  Pantera Capital. Sector: crypto / DeFi.
